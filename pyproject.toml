[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "dama-model"
version = "0.1.0"
description = "DAMA: a small forward-only model for typed memory decisions"
requires-python = ">=3.10,<3.14"
dependencies = ["pydantic==2.11.7", "numpy==2.2.6"]

[project.optional-dependencies]
model = ["torch==2.6.0", "transformers==4.51.3", "safetensors==0.5.3"]
train = ["torch==2.6.0", "transformers==4.51.3", "safetensors==0.5.3", "peft==0.15.2", "accelerate==1.6.0"]
dev = ["pytest==8.4.1", "build==1.2.2.post1"]

[project.scripts]
dama = "dama.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
